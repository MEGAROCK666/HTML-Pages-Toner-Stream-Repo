<!-- ================================================================================================================================================================================
Когато има таблица в текста от CKEditor, тя трябва да бъде обвита в <div class="seo-content">...</div> 
за да се приложи CSS стилизирането и да се избегне разширяване на таблицата извън контейнера(да не е глобално - чупи трохите).
================================================================================================================================================================================ -->



 <!-- Обвий текста от CKEditor в: -->
 <!-- <div class="seo-content">
  ...текст от CKEditor...
 </div> -->


<!-- След това използвай този CSS: -->



<style>
  /* ==================================================
     SEO CONTENT - RESPONSIVE TEXT
     ================================================== */

  .seo-content {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }

  .seo-content p,
  .seo-content li {
    max-width: 100%;
    box-sizing: border-box;
    overflow-wrap: anywhere;
    word-wrap: break-word;
    word-break: normal;
  }

  /* Дълги линкове само вътре в SEO текста */
  .seo-content a {
    max-width: 100%;
    white-space: normal !important;
    overflow-wrap: anywhere !important;
    word-wrap: break-word !important;
    word-break: break-word !important;
  }


  /* ==================================================
     TABLES
     ================================================== */

  .seo-content table {
    width: 100%;
    max-width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    margin: 20px 0;
    font-family: "Sofia Sans", "Open Sans", Arial, sans-serif;
    box-sizing: border-box;
  }

  .seo-content table,
  .seo-content th,
  .seo-content td {
    border: 1px solid #ccc;
    box-sizing: border-box;
  }

  .seo-content th,
  .seo-content td {
    padding: 10px;
    text-align: left;
    vertical-align: top;
    white-space: normal !important;
    overflow-wrap: anywhere !important;
    word-wrap: break-word !important;
    word-break: normal;
    min-width: 0;
  }

  .seo-content th {
    background-color: #f2f2f2;
    font-weight: bold;
  }

  .seo-content tr:nth-child(even) {
    background-color: #fafafa;
  }

  /* Параграфи вътре в таблиците */
  .seo-content table p {
    margin-top: 0;
    margin-bottom: 0;
    max-width: 100%;
  }

  /* Дълги линкове вътре в таблиците */
  .seo-content table a {
    white-space: normal !important;
    overflow-wrap: anywhere !important;
    word-break: break-word !important;
  }

  /* Елементите в клетките да не разширяват таблицата */
  .seo-content th *,
  .seo-content td * {
    max-width: 100%;
    box-sizing: border-box;
  }


  /* ==================================================
     IMAGES
     ================================================== */

  .seo-content img {
    max-width: 100%;
    height: auto;
  }


  /* ==================================================
     TABLET / MOBILE
     ================================================== */

  @media (max-width: 768px) {

    .seo-content p,
    .seo-content li {
      overflow-wrap: anywhere !important;
      word-wrap: break-word !important;
    }

    .seo-content a {
      white-space: normal !important;
      overflow-wrap: anywhere !important;
      word-wrap: break-word !important;
      word-break: break-word !important;
    }

    .seo-content table {
      width: 100% !important;
      max-width: 100% !important;
      table-layout: fixed !important;
      margin: 15px 0;
      font-size: 13px;
    }

    .seo-content th,
    .seo-content td {
      padding: 6px;
      white-space: normal !important;
      overflow-wrap: anywhere !important;
      word-wrap: break-word !important;
      word-break: break-word !important;
    }
  }


  /* ==================================================
     SMALL MOBILE
     ================================================== */

  @media (max-width: 480px) {

    .seo-content table {
      width: 100% !important;
      max-width: 100% !important;
      table-layout: fixed !important;
      margin: 12px 0;
      font-size: 12px;
    }

    .seo-content th,
    .seo-content td {
      padding: 4px;
      line-height: 1.35;
    }

    .seo-content a {
      overflow-wrap: anywhere !important;
      word-break: break-word !important;
    }
  }
</style>

<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">

  <title>Content</title>

  <style>
    /* Общ responsive контрол за текстовото съдържание */
    body,

    li,

    a {
      max-width: 100%;
      box-sizing: border-box;
    }

    li,
    div {
      overflow-wrap: anywhere;
      word-wrap: break-word;
      word-break: normal;
    }

    /* Дълги линкове */
    a {
      max-width: 100%;
      white-space: normal !important;
      overflow-wrap: anywhere !important;
      word-wrap: break-word !important;
      word-break: break-word !important;
    }

    /* TABLE */
    table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin: 20px 0;
      font-family: "Sofia Sans", "Open Sans", Arial, sans-serif;

    }

    th,

      padding: 10px;
      text-align: left;
      vertical-align: top;
      white-space: normal !important;
      overflow-wrap: anywhere !important;
      word-wrap: break-word !important;
      word-break: normal;
      min-width: 0;
    }

    th {
      background-color: #f2f2f2;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }

    /* Премахва излишните отстояния в параграфи вътре в таблица */
    table p {
      margin-top: 0;
      margin-bottom: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-wrap: break-word;
    }

    /* Линкове вътре в таблици */
    table a {
      max-width: 100%;
      white-space: normal !important;
      overflow-wrap: anywhere !important;
      word-wrap: break-word !important;
      word-break: break-word !important;
    }

    /* Всички елементи вътре в клетките да не могат да разширят таблицата */
    th *,

      max-width: 100%;
      box-sizing: border-box;
      overflow-wrap: anywhere;
      word-wrap: break-word;
    }

    img {

    }

    @media (max-width: 768px) {

      div,

        max-width: 100% !important;
      }

      p,
      li,
      div {
        overflow-wrap: anywhere !important;
        word-wrap: break-word !important;
      }

      a {
        white-space: normal !important;
        overflow-wrap: anywhere !important;
        word-wrap: break-word !important;
        word-break: break-word !important;
      }

      table {
        width: 100% !important;
        max-width: 100% !important;
        table-layout: fixed !important;
        margin: 15px 0;
        font-size: 13px;
      }

      th,
      td {
        padding: 6px;
        white-space: normal !important;
        overflow-wrap: anywhere !important;
        word-wrap: break-word !important;
        word-break: break-word !important;
      }
    }

    /* Малки мобилни телефони */
    @media (max-width: 480px) {
      table {
        width: 100% !important;
        max-width: 100% !important;
        table-layout: fixed !important;
        margin: 12px 0;
        font-size: 12px;
      }

      th,
      td {
        padding: 4px;
